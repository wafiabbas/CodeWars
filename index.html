<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pirates Campus</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
:root{--g:#d9a441;--g2:#f3d08a;--t:#ece2c8;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#010409;color:var(--t);font:17px/1.55 'IM Fell English',Georgia,serif;overflow:hidden}
h1,h2,h3,.cz,.plq span,.btn{font-family:Cinzel,'Trajan Pro',Georgia,serif;letter-spacing:.07em;font-weight:500}
#sky{position:fixed;inset:0;background:linear-gradient(#010309,#07121f 40%,#10304a 62%,#020910 63%,#010409)}
.moon{position:absolute;left:68%;top:12%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#f6e4b0 0 18%,rgba(246,228,176,.35) 23%,transparent 64%)}
.cl{position:absolute;width:60vw;height:18vh;border-radius:50%;background:radial-gradient(ellipse,rgba(70,90,115,.45),transparent 70%);filter:blur(22px);animation:dr 70s linear infinite}
.c1{top:8%;left:-10%}.c2{top:26%;left:30%;animation-duration:95s;opacity:.7}.c3{top:40%;left:-30%;animation-duration:80s;opacity:.5}
@keyframes dr{to{transform:translateX(60vw)}}
#sea,#wv{position:fixed;inset:0;width:100%;height:100%}#wv{display:none;z-index:100;pointer-events:none}
#world{position:fixed;inset:0;z-index:5;transform-origin:50% 85%}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem}
.ship{position:absolute;left:8%;bottom:35.5%;width:30vw;max-width:460px;animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px) rotate(-1.2deg)}}
.tag{position:absolute;top:5%;font-size:.8rem;letter-spacing:.7em;opacity:.35}
#map{background:none;border:0;cursor:pointer;width:min(540px,76vw);filter:drop-shadow(0 20px 40px #000) drop-shadow(0 0 26px rgba(217,164,65,.25));transition:transform .25s,filter .4s;animation:fl 6s ease-in-out infinite}
#map:hover,#map:focus-visible{filter:drop-shadow(0 20px 40px #000) drop-shadow(0 0 42px rgba(243,208,138,.65));outline:0}
@keyframes fl{50%{translate:0 -10px}}
#loc{letter-spacing:.35em;font-size:.8rem;opacity:.55;text-transform:uppercase}#loc b{color:var(--g2);font-weight:400}
#campus{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(rgba(2,5,10,.5),rgba(2,5,10,.8))}
header{display:flex;align-items:center;gap:1.5rem;padding:.9rem 2rem}
.brand{color:var(--g);white-space:nowrap;font-size:1.05rem}
nav{flex:1;display:flex;justify-content:space-around;gap:.4rem;position:relative}
nav::before{content:"";position:absolute;left:0;right:0;top:15px;border-top:2px dotted rgba(217,164,65,.5)}
.plq{position:relative;padding:.5rem .9rem;background:linear-gradient(#4a331a,#271909);color:#cdb98f;border:0;cursor:pointer;clip-path:polygon(0 16%,5% 0,95% 0,100% 16%,100% 84%,95% 100%,5% 100%,0 84%);display:flex;flex-direction:column;align-items:center;min-width:118px;transition:.3s}
.plq span{font-size:.82rem}.plq small{font-size:.7rem;opacity:.7;font-style:italic}
.plq:hover{filter:brightness(1.35)}.plq.on{background:linear-gradient(#f0c874,#a87a28);color:#1a0f03;transform:translateY(3px)}
#stage{flex:1;overflow:auto;padding:1rem 2rem 7rem}.wrap{max-width:1100px;margin:auto;animation:up .9s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.1;margin:.4rem 0 .8rem;color:var(--g2)}h2{font-size:1.4rem;color:var(--g);margin:2rem 0 .8rem}h3{font-size:1.05rem;color:var(--g2)}
.kick{color:var(--g);font-size:.8rem}.lead{max-width:60ch;font-size:1.15rem;opacity:.88}.sub{opacity:.7;font-style:italic}
.g{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:linear-gradient(160deg,rgba(24,36,52,.85),rgba(8,14,24,.9));border:1px solid rgba(217,164,65,.28);padding:1.1rem 1.2rem;border-radius:3px;backdrop-filter:blur(6px);box-shadow:0 10px 30px #0008;transition:.3s}
.card small{display:block;opacity:.6;font-size:.82rem}.card .cnt{font-size:2.2rem;color:var(--g2);display:block}
.xp{cursor:pointer}.xp:hover,.xp.open{border-color:var(--g);transform:translateY(-3px)}
.d{max-height:0;overflow:hidden;opacity:0;transition:.5s}.xp:hover .d,.xp.open .d{max-height:90px;opacity:1;margin-top:.5rem}
.note{background:linear-gradient(#dcc698,#c4a46a);color:#2d1d0b;padding:1.1rem;transform:rotate(var(--r));box-shadow:0 12px 24px #000a;clip-path:polygon(0 2%,8% 0,100% 1%,99% 98%,90% 100%,1% 99%)}.note small{font-weight:700;opacity:.7}
.q{font-size:1.35rem;font-style:italic;color:var(--g2)}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--v)*1%),#1a2535 0);display:grid;place-items:center;margin:.6rem auto}
.ring b{width:84px;height:84px;border-radius:50%;background:#0a1220;display:grid;place-items:center;font:600 1.3rem Cinzel,serif;color:var(--g2)}
.bar{height:8px;background:#1a2535;border-radius:4px;overflow:hidden;margin:.3rem 0 .7rem}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#8a6420,var(--g2));transition:width .8s}
.ms{display:flex;gap:.6rem;padding:.4rem 0;cursor:pointer;border-bottom:1px dotted rgba(217,164,65,.25)}.ms::before{content:"";width:16px;height:16px;border:1.5px solid var(--g);border-radius:50%;flex:none;margin-top:5px}.ms.done::before{background:var(--g)}.ms.done{opacity:.55;text-decoration:line-through}
.btn,select,input,textarea{background:#2a1c0c;color:var(--g2);border:1px solid var(--g);padding:.55rem 1.1rem;font-size:.9rem;border-radius:2px;cursor:pointer}
input,textarea,select{font-family:inherit;cursor:text;background:#d9c394;color:#2d1d0b;width:100%;margin-bottom:.7rem;font-size:1rem}select{width:auto;cursor:pointer;margin:0 .6rem 0 0}.btn:hover{background:var(--g);color:#1a0f03}.row{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}
table{width:100%;border-collapse:collapse;margin-top:1rem}td,th{padding:.5rem;border-bottom:1px solid rgba(217,164,65,.2);text-align:left}th{color:var(--g)}
footer{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:1rem 2rem;pointer-events:none}
.cmp{pointer-events:auto;display:flex;align-items:center;gap:.7rem;background:rgba(5,10,18,.85);border:1px solid rgba(217,164,65,.45);color:var(--g2);padding:.35rem 1.2rem .35rem .4rem;border-radius:40px;cursor:pointer;font:500 .85rem Cinzel,serif;letter-spacing:.1em}
.cmp svg{width:38px;height:38px;transition:transform .9s}.cmp:hover svg{transform:rotate(180deg)}.cmp[disabled]{opacity:.25;pointer-events:none}.cmp.f{flex-direction:row-reverse;padding:.35rem .4rem .35rem 1.2rem}
#snd{position:fixed;top:12px;right:14px;z-index:50;display:none;background:none;border:1px solid rgba(217,164,65,.4);color:var(--g2);font:.75rem Cinzel,serif;padding:.3rem .8rem;border-radius:20px;cursor:pointer;letter-spacing:.1em}
#toast{position:fixed;left:50%;bottom:90px;translate:-50% 20px;opacity:0;background:#1a0f03;color:var(--g2);border:1px solid var(--g);padding:.6rem 1.4rem;z-index:60;transition:.4s;pointer-events:none}#toast.on{opacity:1;translate:-50% 0}
.sail{animation:cast 3s ease-in forwards}@keyframes cast{to{transform:translate(160px,-30px) rotate(40deg);opacity:0}}
#campus{overflow:hidden}.plq{min-width:132px}.plq small{white-space:nowrap}
#mapwrap{position:relative;z-index:2;display:grid;place-items:center}#mapwrap>*{grid-area:1/1}
#scroll{background:none;border:0;cursor:pointer;width:min(400px,72vw);color:var(--g2);display:flex;flex-direction:column;align-items:center;gap:.7rem;font:500 .8rem Cinzel,serif;letter-spacing:.45em;filter:drop-shadow(0 18px 30px #000) drop-shadow(0 0 22px rgba(217,164,65,.25));animation:fl 6s ease-in-out infinite;transition:transform 1s,opacity 1s,filter .4s}
#scroll:hover,#scroll:focus-visible{filter:drop-shadow(0 18px 30px #000) drop-shadow(0 0 40px rgba(243,208,138,.65));outline:0}
#scroll.gone{transform:scale(.55) translateY(90px) rotate(-10deg);opacity:0;pointer-events:none}
#map{position:relative;clip-path:inset(0 50% 0 50%);opacity:0;pointer-events:none;transform:perspective(900px) rotateX(40deg) scale(.6);animation:none}
#map.unfold{animation:unf 2.1s cubic-bezier(.2,.7,.2,1) forwards}
#map.ready{clip-path:none;opacity:1;pointer-events:auto;transform:none;animation:fl 6s ease-in-out infinite}
@keyframes unf{0%{clip-path:inset(0 50% 0 50%);opacity:0;transform:perspective(900px) rotateX(40deg) scale(.6)}30%{opacity:1}100%{clip-path:inset(0);opacity:1;transform:perspective(900px) rotateX(0) scale(1)}}
#sail{opacity:0;pointer-events:none;transition:opacity 1.2s;letter-spacing:.25em;position:relative;z-index:2}#sail.on{opacity:1;pointer-events:auto}
.fog{position:absolute;left:-30%;width:160%;height:26vh;pointer-events:none;background:radial-gradient(ellipse,rgba(150,175,195,.17),transparent 65%);filter:blur(18px);animation:fg 50s ease-in-out infinite alternate}.f1{bottom:30%}.f2{bottom:10%;z-index:1;animation-duration:36s;animation-direction:alternate-reverse}
@keyframes fg{to{transform:translateX(18%)}}
#intro{transform-origin:50% 80%;animation:push 50s ease-out forwards}@keyframes push{to{scale:1.05}}
.moon{animation:mg 9s ease-in-out infinite}@keyframes mg{50%{filter:brightness(1.25);scale:1.06}}
.ray{position:absolute;left:68%;top:calc(12% + 75px);width:150px;height:70vh;transform-origin:50% 0;background:linear-gradient(rgba(246,228,176,.16),transparent 75%);filter:blur(14px);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:rs 16s ease-in-out infinite alternate}@keyframes rs{from{rotate:-10deg;opacity:.5}to{rotate:8deg;opacity:1}}
.ph{display:flex;align-items:center;gap:1rem;padding:.9rem 1.5rem;margin:.4rem 0 1.4rem;background:repeating-linear-gradient(92deg,#3a2612 0 6px,#2e1d0d 6px 11px,#43301a 11px 15px);border-top:2px solid #6b4a25;box-shadow:0 12px 26px #000a;clip-path:polygon(0 8%,1.5% 0,98.5% 0,100% 8%,100% 92%,98.5% 100%,1.5% 100%,0 92%)}
.ph svg{width:46px;flex:none;animation:spin 40s linear infinite}@keyframes spin{to{rotate:360deg}}.ph h2{margin:0;font-size:1.5rem;color:var(--g2)}.ph .sub{margin:0}
.wm{position:absolute;right:-6vw;bottom:-8vw;width:38vw;opacity:.07;pointer-events:none;animation:spin 140s linear infinite}
.card{--rv:rgba(217,164,65,.5);background:radial-gradient(circle at 9px 9px,var(--rv) 1.8px,#0000 2.8px),radial-gradient(circle at calc(100% - 9px) 9px,var(--rv) 1.8px,#0000 2.8px),radial-gradient(circle at 9px calc(100% - 9px),var(--rv) 1.8px,#0000 2.8px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--rv) 1.8px,#0000 2.8px),linear-gradient(160deg,rgba(24,36,52,.85),rgba(8,14,24,.9))}
@media(max-width:900px){.plq small{display:none}.plq{min-width:80px;padding:.5rem .4rem}header{flex-direction:column;gap:.6rem;padding:.7rem 1rem}.brand{font-size:.9rem}#stage{padding:1rem}.ship{width:44vw}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>

<g transform="translate(335 195)" stroke="#4a2e12" fill="none"><circle r="17"/><path d="M0-22V22M-22 0H22" stroke-width="1"/><path d="M0-17 4 0 0 17-4 0z" fill="#8c2a1a"/></g>
<text x="200" y="64" text-anchor="middle" font-family="Cinzel,serif" font-size="15" fill="#3d2610" letter-spacing="5">CHART THE COURSE</text></svg></button>
</div><p id="loc"></p><button class="btn" id="sail">Set sail</button>
</section>
<section id="campus">

</section></div>

function startAudio(){try{aud.src=AUDIO_SRC;const p=aud.play();if(p)p.then(()=>{$('snd').style.display='block';let v=0;const f=setInterval(()=>{v+=.03;aud.volume=Math.min(.45,v);if(v>=.45)clearInterval(f)},120)}).catch(()=>{})}catch(e){}}

/* ---- ocean + embers ---- */
const sea=$('sea'),b=sea.getContext('2d'),wv=$('wv'),w=wv.getContext('2d');let W,H;
const EM=[...Array(50)].map(()=>({x:Math.random(),y:Math.random(),s:.0001+Math.random()*.0003,r:Math.random()*1.8+.5,p:Math.random()*6}));
function rs(){W=sea.width=wv.width=innerWidth;H=sea.height=wv.height=innerHeight}addEventListener('resize',rs);rs();
function draw(t){b.clearRect(0,0,W,H);
for(let i=0;i<5;i++){const y0=H*(.63+i*.075),A=5+i*4;b.beginPath();b.moveTo(0,H);
for(let x=0;x<=W;x+=14)b.lineTo(x,y0+A*Math.sin(x*.008+t*.0012*(1+i*.2)+i*2)+A*.5*Math.sin(x*.02-t*.001+i));
b.lineTo(W,H);b.fillStyle='rgb('+(14-i*3)+','+(38-i*7)+','+(58-i*10)+')';b.fill();if(i<2){b.strokeStyle='rgba(217,164,65,.14)';b.stroke()}}
for(let k=0;k<22;k++){b.fillStyle='rgba(243,208,138,'+.22*(.5+.5*Math.sin(t*.003+k))+')';b.fillRect(W*.68+75+Math.sin(t*.002+k*2)*(4+k)-(10+k*2),H*.64+k*H*.011,20+k*4,2)}
for(let k=0;k<34;k++){const x=(k*W/34+t*(.012+k%4*.006))%W,y=H*(.68+(k%6)*.045)+Math.sin(t*.001+k)*3;b.fillStyle='rgba(200,225,235,'+(.06+.06*Math.sin(t*.002+k))+')';b.fillRect(x,y,16+k%5*6,1.5)}
for(let k=0;k<5;k++){const x=((k*.27+t*.000012*(1+k*.3))%1.3-.15)*W,y=H*(.56+k*.03),g=b.createRadialGradient(x,y,0,x,y,W*.22);g.addColorStop(0,'rgba(120,150,170,.07)');g.addColorStop(1,'rgba(120,150,170,0)');b.fillStyle=g;b.fillRect(x-W*.22,y-W*.22,W*.44,W*.44)}
for(const p of EM){p.y-=p.s;if(p.y<0)p.y=1;b.fillStyle='rgba(243,208,138,'+(.15+.25*Math.sin(t*.002+p.p))+')';b.fillRect(p.x*W+Math.sin(t*.001+p.p)*20,p.y*H,p.r,p.r)}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
/* ---- OCEAN WAVE TRANSITION ---- dir 1 = surge toward viewer, -1 = sea pulls back ---- */
function wave(dir,swap){return new Promise(done=>{
const D=dir>0?[1400,1200]:[2100,1900],HOLD=220,t0=performance.now(),world=$('world');let sw=0;
const ei=p=>p*p*(.4+.6*p),eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const col=dir>0?['#2c8aa3','#12526a','#08283c']:['#4a8591','#26566a','#0d2e3c'];
wv.style.display='block';
(function f(now){const el=now-t0;let L;
if(el<D[0]){const p=el/D[0];L=1.32*(dir>0?ei(p):eio(p))}
else if(el<D[0]+HOLD){L=1.32;if(!sw){sw=1;swap()}}
else if(el<D[0]+HOLD+D[1]){const p=(el-D[0]-HOLD)/D[1];L=1.32*(1-(dir>0?eo(p):eio(p)))}
else{w.clearRect(0,0,W,H);wv.style.display='none';world.style.transform='';return done()}
const ph=el*.0035*dir,A=(30+45*Math.sin(Math.PI*Math.min(1,L/1.32)))*(dir>0?1.2:.7);
world.style.transform='scale('+(1+dir*.07*L/1.32)+')';w.clearRect(0,0,W,H);
for(let i=2;i>=0;i--){const lead=L-.07*i;let ey=[];w.beginPath();w.moveTo(0,dir>0?H:0);
for(let x=0;x<=W;x+=12){const s=Math.sin(x*.006-ph+i*1.3),y=(dir>0?H*(1-lead)-A*s-A*.6*Math.pow(Math.max(0,Math.sin(x*.004-ph)),3):H*lead+A*s)+A*.5*Math.sin(x*.017-ph*1.6+i);w.lineTo(x,y);if(i==0)ey.push([x,y])}
w.lineTo(W,dir>0?H:0);w.closePath();const y0=dir>0?H*(1-lead):H*lead,g=w.createLinearGradient(0,y0,0,y0+(dir>0?1:-1)*H*.9);g.addColorStop(0,col[i]);g.addColorStop(1,'#04121c');w.fillStyle=g;w.fill();
if(i==0){w.beginPath();ey.forEach((p,k)=>k?w.lineTo(p[0],p[1]):w.moveTo(p[0],p[1]));w.strokeStyle='rgba(235,248,252,'+(dir>0?.9:.45)+')';w.lineWidth=dir>0?6:3;w.shadowColor='#fff';w.shadowBlur=10;w.stroke();w.shadowBlur=0;
if(dir>0){w.fillStyle='rgba(235,248,252,.55)';for(let k=0;k<40;k++){const p=ey[Math.random()*ey.length|0];w.fillRect(p[0]+Math.random()*10,p[1]-Math.random()*40,2,2)}}
else{w.strokeStyle='rgba(180,220,230,.18)';w.lineWidth=1;for(let k=0;k<14;k++){const x=(k*W/14+el*.08)%W;w.beginPath();w.moveTo(x,y0);w.lineTo(x-20,y0-Math.min(300,H*.4));w.stroke()}}}}
requestAnimationFrame(f)})(t0)})}

let cur=-1,busy=0;
$('nav').innerHTML=N.map((n,i)=>'<button class="plq" data-i="'+i+'"><span>'+n[0]+'</span><small>'+n[1]+'</small></button>').join('');
const CMP=r=>'<svg viewBox="0 0 40 40" style="rotate:'+r+'deg"><circle cx="20" cy="20" r="18" fill="none" stroke="#d9a441" stroke-width="1.5"/><path d="M20 4l5 16-5 16-5-16z" fill="#d9a441" opacity=".85"/><path d="M20 4l5 16H15z" fill="#9b1c1c"/></svg>';
$('bk').innerHTML=CMP(-90)+'<span>RETREAT</span>';$('fw').innerHTML=CMP(90)+'<span>SAIL ON</span>';
async function go(i,dir,first){if(busy||i==cur||i<0||i>5)return;busy=1;await wave(dir,()=>{if(first){$('intro').style.display='none';$('campus').style.display='flex'}show(i)});busy=0}
const navigateForward=()=>go(cur+1,1),navigateBackward=()=>go(cur-1,-1);
$('nav').onclick=e=>{const x=e.target.closest('.plq');if(x){const i=+x.dataset.i;go(i,i>cur?1:-1)}};
$('bk').onclick=navigateBackward;$('fw').onclick=navigateForward;
addEventListener('keydown',e=>{if(cur<0)return;if(e.key=='ArrowRight')navigateForward();if(e.key=='ArrowLeft')navigateBackward()});
let opened=0;
function sail(){if(!opened||busy||cur>=0||!$('map').classList.contains('ready'))return;go(0,1,1)}
$('scroll').onclick=()=>{if(opened)return;opened=1;startAudio();const m=$('map');$('scroll').classList.add('gone');setTimeout(()=>{m.classList.add('unfold');$('loc').innerHTML='Course set for <b>'+LOC[li]+'</b>'},600);setTimeout(()=>{m.classList.remove('unfold');m.classList.add('ready');m.tabIndex=0;$('sail').textContent='Set sail for '+LOC[li];$('sail').classList.add('on')},2800)};
$('map').onclick=sail;$('sail').onclick=sail;
$('intro').onmousemove=e=>{if(!$('map').classList.contains('ready'))return;$('map').style.transform='perspective(900px) rotateY('+((e.clientX/innerWidth-.5)*14)+'deg) rotateX('+((.5-e.clientY/innerHeight)*10)+'deg)'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
/* ---- content ---- */
const SH=[["The Black Compiler","Computer Applications","BCA, MCA and Data Analytics. Cannons loaded with Python and SQL."],["Iron Kraken","Mechanical Engineering","Thermal, CAD and Robotics workshops on a steel hull."],["Gold Galleon","Commerce & Management","BCom, BBA and Finance. Learn to count the plunder."],["Siren's Verse","Arts & Humanities","Literature, History and Media under lantern light."],["Tempest Lab","Science","Physics, Chemistry and Maths for storm chasers."],["Sea Lantern","Education & Law","Teaching, Policy and Law to keep the code of the seas."]];
const FA=[["Treasure Vault","Library","40,000 volumes, digital archives, silent decks open till midnight."],["Crew Quarters","Hostel","Secure bunks for 1,200 crew with a warden on night watch."],["Pirate Tavern","Canteen","Hot galley meals from dawn to dusk, long tables for study crews."],["Cannon Deck","Sports Ground","Cricket, football and athletics on open deck."],["Navigation Lab","Computer Labs","300 workstations with fast Wi-Fi and data tools."],["Lighthouse Hall","Auditorium","900 seats for seminars, plays and Captain's addresses."]];
const ORD=[["Posted today","All crew assemble on the main deck for orientation at dawn."],["Final Voyage","Exam charts will be hoisted on 12 November. Study the winds."],["Treasure Hunt","Northwind Analytics boards the campus on 20 November. Polish your maps."]];
const E={paid:60000,tot:85000,m:[["Normalise the Cargo Ledger (SQL)",1],["Chart the Storm Data (Pandas)",0],["Dashboard of the Seven Seas (Power BI)",0],["Treasure Report Viva",0]]};
const R={"PC-2041":["Jack Rackham","The Black Compiler",[91,86,78,94,88]],"PC-2042":["Anne Bonny","Gold Galleon",[84,92,88,79,90]],"PC-2043":["Edward Teach","Iron Kraken",[72,68,81,75,70]]};
const SUBJ=["Programming Seamanship","Database Navigation","Applied Statistics","Data Cartography","Law of the Seas"];
const PH=(t,s)=>'<div class="ph"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#d9a441" stroke-width="1.5"/><path d="M20 3l4 17-4 17-4-17zM3 20l17-4 17 4-17 4z" fill="#d9a441"/></svg><div><h2>'+t+'</h2><p class="sub">'+s+'</p></div></div>';
const gr=m=>m>=90?'S':m>=80?'A':m>=70?'B':'C',J=a=>a.join('');
const P=[
()=>PH("Captain's Deck","The college designed by pirates")+'<h1>Welcome aboard, Crew Member.</h1><p class="lead">Chart your future across the seven seas of learning. The Captain, the Senior Crew and twelve ships are ready to sail at dawn.</p><div class="g" style="margin-top:1.6rem">'+J([[4200,"Crew Members"],[180,"Senior Crew"],[12,"Ships (Departments)"],[96,"Crew placed (%)"]].map(s=>'<div class="card"><b class="cnt cz" data-n="'+s[0]+'">0</b>'+s[1]+'</div>'))+'</div><h2>Captain\'s Orders</h2><div class="g">'+J(ORD.map((o,i)=>'<div class="note" style="--r:'+[-2,1.5,-1][i]+'deg"><small>'+o[0]+'</small><p>'+o[1]+'</p></div>'))+'</div>',
()=>PH("Captain's Chronicle","The story, charter and fleet of Pirates Campus")+'<div class="card"><p class="q">"We do not teach you to follow the tide. We teach you to read the stars and set your own course."</p><small>The Captain, Principal of Pirates Campus</small></div><div class="g" style="margin-top:1rem"><div class="card"><h3>Our Charter</h3><p>Founded in 1998, Pirates Campus trains crews who question maps, build their own, and return with treasure for everyone aboard.</p></div><div class="card"><h3>Senior Crew</h3><p>180 faculty, each a master of their craft, sail with you through every voyage.</p></div></div><h2>The Fleet</h2><p class="sub">Tap a ship to see her course.</p><div class="g" style="margin-top:.6rem">'+J(SH.map(s=>'<div class="card xp" data-a="xp"><small>'+s[1]+'</small><h3>'+s[0]+'</h3><p class="d">'+s[2]+'</p></div>'))+'</div>',
()=>PH("Ship & Crew Resources","Library, hostel, canteen and more: every harbour a crew member needs")+'<div class="g">'+J(FA.map(s=>'<div class="card xp" data-a="xp"><small>'+s[1]+'</small><h3>'+s[0]+'</h3><p class="d">'+s[2]+'</p></div>'))+'</div>',
()=>{const d=E.m.filter(x=>x[1]).length,pc=Math.round(E.paid/E.tot*100);return PH("Crew Command Center","Jack Rackham, Crew ID PC-2041, aboard The Black Compiler")+'<div class="g g2"><div class="card"><h3>Crew Discipline</h3><small>Attendance</small><div class="ring" style="--v:88"><b>88%</b></div>'+J([["Programming",92],["Database",85],["Statistics",87]].map(s=>s[0]+'<div class="bar" style="--w:'+s[1]+'%"><i></i></div>'))+'</div><div class="card"><h3>Missions</h3><small>Assignments, '+d+' of '+E.m.length+' complete</small>'+J(E.m.map((m,i)=>'<div class="ms'+(m[1]?' done':'')+'" data-a="ms" data-i="'+i+'">'+m[0]+'</div>'))+'<div class="bar" style="--w:'+d/E.m.length*100+'%"><i></i></div></div><div class="card"><h3>Ship Maintenance Tax</h3><small>Fees</small><p class="cz" style="font-size:1.4rem;margin:.5rem 0">₹'+E.paid.toLocaleString('en-IN')+' / ₹'+E.tot.toLocaleString('en-IN')+'</p><div class="bar" style="--w:'+pc+'%"><i></i></div>'+(E.paid<E.tot?'<button class="btn" data-a="pay">Pay remaining dues</button>':'<p>All dues cleared. The ship sails smooth.</p>')+'</div><div class="card"><h3>Final Voyage</h3><small>Examination chart</small>'+J([["12 Nov","Database Navigation"],["14 Nov","Applied Statistics"],["17 Nov","Data Cartography"]].map(s=>'<p><b class="cz" style="color:var(--g)">'+s[0]+'</b>&nbsp; '+s[1]+'</p>'))+'</div></div>'},
()=>PH("Voyage Records","Final Voyage results and Treasure Hunt placements")+'<div class="card"><div class="row"><select id="cid">'+J(Object.keys(R).map(k=>'<option>'+k+'</option>'))+'</select><button class="btn" data-a="res">Unfurl results</button></div><div id="rout" class="sub" style="margin-top:.8rem">Choose a Crew ID and unfurl your chart.</div></div><h2>Treasure Hunt</h2><div class="g">'+J([["Northwind Analytics","Data Analyst","8.5 LPA"],["Blue Lantern Systems","Business Analyst","7.2 LPA"],["Tidewater Labs","Data Science Trainee","9.0 LPA"]].map(s=>'<div class="card"><small>'+s[0]+'</small><h3>'+s[1]+'</h3><b class="cz" style="color:var(--g)">'+s[2]+'</b></div>'))+'</div>',
()=>PH("Send a Message to the Captain","Seal it in a bottle and cast it to sea")+'<div class="g g2"><div class="card" id="bt"><label class="sub">Crew name</label><input id="cn" placeholder="Your name"><label class="sub">Your message for the Captain</label><textarea id="cm" rows="5" placeholder="Write your message..."></textarea><button class="btn" data-a="cast">Seal and cast to sea</button></div><div class="card"><h3>Captain\'s Harbor</h3><p>Pirates Campus, Harbor Road<br>Bihar Sharif, Bihar</p><p style="margin-top:.8rem">Harbour open Monday to Saturday, 9 AM to 5 PM.<br>admissions@piratescampus.demo</p></div></div>'];
function render(){const s=$('stage'),y=s.scrollTop;s.innerHTML='<div class="wrap">'+P[cur]()+'</div>';s.scrollTop=y;
document.querySelectorAll('.cnt').forEach(c=>{const n=+c.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1400);c.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function show(i){cur=i;$('stage').scrollTop=0;render();document.querySelectorAll('.plq').forEach((p,k)=>p.classList.toggle('on',k==i));$('bk').disabled=i==0;$('fw').disabled=i==5}
const A={xp:a=>a.classList.toggle('open'),pay:()=>{E.paid=E.tot;render();toast('Dues paid. The ship is seaworthy.')},ms:a=>{E.m[a.dataset.i][1]^=1;render()},
res:()=>{const r=R[$('cid').value],t=r[2].reduce((x,y)=>x+y,0)/5;$('rout').innerHTML='<h3>'+r[0]+', '+r[1]+'</h3><table><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>'+J(r[2].map((m,i)=>'<tr><td>'+SUBJ[i]+'</td><td>'+m+'</td><td class="cz">'+gr(m)+'</td></tr>'))+'</table><p class="cz" style="margin-top:1rem;color:var(--g2)">Average '+t.toFixed(1)+'%. Final Voyage cleared.</p>'},
cast:()=>{if(!$('cm').value.trim())return toast('Write your message first.');$('bt').innerHTML='<svg class="sail" width="80" viewBox="0 0 40 70"><rect x="14" y="2" width="12" height="10" fill="#8a6420"/><rect x="8" y="12" width="24" height="54" rx="8" fill="#6fb0b8" opacity=".6" stroke="#d9a441"/><rect x="14" y="30" width="12" height="18" fill="#d9c394"/></svg><p class="sub">Your bottle drifts toward Captain\'s Harbor...</p>';toast('Message cast to sea.')}};
$('stage').onclick=e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a)};
</script></body></html>
